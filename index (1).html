<html lang="en">
<head>

  <meta charset="UTF-8" />

  <title>Accessible Public Space Finder · Mandya</title>
  <meta name="description" content="Find parks, libraries, community centres and public toilets in Mandya with ramps, wheelchair access, lighting, seating and toilets." />
  <!-- Leaflet: free, open-source map library (draws the OpenStreetMap map) -->

  <style>
/* =====================================================================
   style.css: how the website LOOKS.
   Colours are kept as "variables" at the top, so high-contrast mode
   only has to change these few lines.
   ===================================================================== */
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --text: #1d2521;
  --muted: #55605a;
  --line: #d9ded9;
  --accent: #0b6e4f;        /* main green */
  --accent-text: #ffffff;
  --yes-bg: #e3f4ea;  --yes-text: #145c32;
  --part-bg: #fff3d6; --part-text: #7a4b00;
  --no-bg: #eef0ee;   --no-text: #5d6660;
  --focus: #ffbf47;
  --radius: 12px;
}

/* High-contrast mode: black background, yellow and white text */
body.hc {
  --bg: #000; --surface: #000; --text: #fff; --muted: #fff; --line: #fff;
  --accent: #ffde00; --accent-text: #000;
  --yes-bg: #000; --yes-text: #7dffa1;
  --part-bg: #000; --part-text: #ffde00;
  --no-bg: #000; --no-text: #fff;
  --focus: #00e5ff;
}
body.hc .tag, body.hc .card, body.hc .chip, body.hc input, body.hc select { border: 2px solid var(--line); }

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, "Segoe UI", "Nirmala UI", "Noto Sans Kannada", Roboto, sans-serif;
  font-size: 17px;           /* a bit bigger than default: easier to read */
  line-height: 1.5;
  background: var(--bg);
  color: var(--text);
}

/* A thick, clear outline shows where the keyboard is */
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.skip-link { position: absolute; left: -999px; top: 8px; background: var(--accent); color: var(--accent-text); padding: 8px 12px; border-radius: 8px; z-index: 2000; }
.skip-link:focus { left: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Header ---------- */
.site-header {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
  padding: 14px 16px; background: var(--accent); color: var(--accent-text);
}
.brand { display: flex; gap: 12px; align-items: center; }
.logo { font-size: 2rem; background: var(--accent-text); color: var(--accent); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; }
h1 { margin: 0; font-size: 1.2rem; line-height: 1.2; }
@media (min-width: 600px) { h1 { font-size: 1.35rem; } }
.subtitle { margin: 2px 0 0; font-size: .92rem; opacity: .92; }
.header-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge { font-size: .8rem; padding: 4px 10px; border-radius: 999px; border: 1px solid currentColor; }
.site-header .btn-ghost { color: var(--accent-text); border-color: var(--accent-text); }

.notice {
  margin: 0; padding: 10px 16px; font-size: .9rem;
  background: var(--part-bg); color: var(--part-text); border-bottom: 1px solid var(--line);
}

/* ---------- Buttons and inputs ---------- */
.btn {
  font: inherit; font-size: .95rem; cursor: pointer; min-height: 44px; /* big enough to tap */
  padding: 8px 14px; border-radius: 10px; border: 2px solid var(--accent);
  background: var(--accent); color: var(--accent-text); text-decoration: none;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn-ghost { background: transparent; color: var(--accent); }
.btn-small { min-height: 40px; padding: 6px 12px; font-size: .9rem; }
input[type="search"], select {
  font: inherit; width: 100%; min-height: 46px; padding: 8px 12px;
  border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text);
}

/* ---------- Page layout ---------- */
.layout { display: grid; gap: 16px; padding: 16px; max-width: 1400px; margin: 0 auto; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 14px; align-content: start; }
fieldset { border: 0; margin: 0; padding: 0; }
.field-label { display: block; font-weight: 700; margin-bottom: 6px; padding: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font: inherit; font-size: .92rem; cursor: pointer; min-height: 44px; padding: 6px 12px;
  border-radius: 999px; border: 2px solid var(--line); background: var(--surface); color: var(--text);
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 700; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px; border: 2px solid var(--line); border-radius: 10px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
.check:has(input:checked) { border-color: var(--accent); font-weight: 700; }
.sort-row { display: grid; gap: 8px; }
.small { font-size: .88rem; color: var(--muted); margin: 4px 0; }
.count { font-weight: 700; margin: 0 0 10px; }

.split { display: grid; gap: 16px; }
.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; align-content: start; }
.results:focus { outline: none; }

/* ---------- Result cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--cat);
  border-radius: var(--radius); padding: 14px; scroll-margin: 12px;
}
.card.active { box-shadow: 0 0 0 3px var(--focus); }
.card-top { display: flex; gap: 10px; align-items: flex-start; }
.cat-icon { font-size: 1.6rem; line-height: 1; }
.card-title { flex: 1; min-width: 0; }
.card h2 { margin: 0; font-size: 1.08rem; }
.score { font-size: .8rem; font-weight: 700; white-space: nowrap; padding: 3px 8px; border-radius: 999px; background: var(--yes-bg); color: var(--yes-text); }
.dist { font-weight: 700; color: var(--text); }
.tags { list-style: none; padding: 0; margin: 10px 0 6px; display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .84rem; padding: 3px 9px; border-radius: 8px; }
.tag.yes { background: var(--yes-bg); color: var(--yes-text); font-weight: 600; }
.tag.part { background: var(--part-bg); color: var(--part-text); }
.tag.no { background: var(--no-bg); color: var(--no-text); text-decoration: line-through; }
.src { font-weight: 600; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.empty { padding: 20px; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); }

/* ---------- Map ---------- */
#map { height: 380px; border-radius: var(--radius); border: 1px solid var(--line); background: #dfe7df; }
.map-off { padding: 20px; }
.pin span {
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); font-size: 16px;
}
body.hc .leaflet-tile-pane { filter: grayscale(1) contrast(1.2); }

.site-footer { text-align: center; padding: 16px; }

/* ---------- Bigger screens: filters on the left, list + map side by side ---------- */
@media (min-width: 900px) {
  .layout { grid-template-columns: 320px 1fr; }
  .filters { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; }
  .split { grid-template-columns: minmax(340px, 1fr) 1.1fr; }
  .map-wrap { position: sticky; top: 16px; align-self: start; }
  #map { height: calc(100vh - 140px); min-height: 420px; }
  .results { max-height: none; }
}

</style>
</head>

  <header class="site-header">

        <h1 data-t="title">Accessible Public Space Finder</h1>
        <p class="subtitle" data-t="subtitle">Parks, libraries, community centres and public toilets in Mandya</p>

    </div>
    <div class="header-actions">
      <span id="data-badge" class="badge" role="status"></span>
      <button id="lang-btn" class="btn btn-ghost" type="button" lang="kn">ಕನ್ನಡ</button>
      <button id="contrast-btn" class="btn btn-ghost" type="button" aria-pressed="false">High contrast: off</button>
    </div>
  </header>

  <p class="notice" data-t="notice"></p>

  <main class="layout">
    <!-- ===================== FILTERS ===================== -->
    <section class="filters" aria-label="Search and filters">
      <label class="field-label" for="search" data-t="searchLabel">Search by name or area</label>
      <input id="search" type="search" autocomplete="off" />

      <fieldset>
        <legend class="field-label" data-t="typeLabel">Type of place</legend>
        <div id="category-chips" class="chips"></div>
      </fieldset>

      <fieldset>
        <legend class="field-label" data-t="featuresLabel">Must have</legend>
        <div id="feature-boxes" class="checks"></div>
      </fieldset>

      <div class="sort-row">
        <label class="field-label" for="sort" data-t="sortLabel">Sort by</label>
        <select id="sort">
          <option value="name" data-t="sortName">Name (A–Z)</option>
          <option value="accessible" data-t="sortAccessible">Most accessible</option>
          <option value="nearest" data-t="sortNearest">Nearest to me</option>
        </select>
        <button id="near-btn" class="btn" type="button" data-t="nearMe">📍 Use my location</button>
        <span id="loc-status" class="small" role="status"></span>
      </div>

      <button id="clear-btn" class="btn btn-ghost" type="button" data-t="clear">Clear filters</button>
    </section>

    <!-- ===================== RESULTS + MAP ===================== -->
    <section class="results-area">
      <p id="count" class="count" aria-live="polite"></p>
      <div class="split">
        <ul id="results" class="results" tabindex="-1"></ul>
        <div class="map-wrap">
          <div id="map" role="region" aria-label="Map of places"></div>
          <p class="small" data-t="mapNote"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><p data-t="footer"></p></footer>

  <script>
/* ===== search.js ===== */
// =====================================================================
// search.js: the "brain" of the website.
// It decides WHICH places to show and in WHAT ORDER.
// It has no buttons or HTML in it, so it is easy to test and explain.
// =====================================================================

// The 5 accessibility filters. "key" is the column name in the database.
// test(place) returns true when the place HAS that feature.
const FEATURES = [
  { key: "has_ramp",     test: (p) => p.has_ramp },
  { key: "wheelchair",   test: (p) => p.wheelchair === "yes" },   // "limited" does NOT count
  { key: "has_lighting", test: (p) => p.has_lighting },
  { key: "has_seating",  test: (p) => p.has_seating },
  { key: "has_toilet",   test: (p) => p.has_toilet },
];

// Makes text easy to compare: lower case, no extra spaces.
// "  Gandhi   BHAVAN " -> "gandhi bhavan"
function normalise(text) {
  return String(text || "").toLowerCase().replace(/\s+/g, " ").trim();
}

// Does the place match what the user typed?
// We look in the English AND Kannada name, area and category name,
// so typing "toilet" or "ಶೌಚಾಲಯ" both work. Every word must match.
function matchesText(place, query, categoriesById) {
  const q = normalise(query);
  if (q === "") return true; // empty search box = everything matches
  const cat = categoriesById[place.category] || {};
  const haystack = normalise([
    place.name_en, place.name_kn, place.area_en, place.area_kn,
    cat.name_en, cat.name_kn,
  ].join(" "));
  return q.split(" ").every((word) => haystack.includes(word));
}

// Does the place have EVERY ticked feature? (AND, not OR)
function matchesFeatures(place, tickedKeys) {
  return tickedKeys.every((key) => {
    const feature = FEATURES.find((f) => f.key === key);
    return feature ? feature.test(place) : true;
  });
}

// How many of the 5 features does the place have? (0 to 5)
function accessScore(place) {
  return FEATURES.filter((f) => f.test(place)).length;
}

// Straight-line distance in km between two map points (the "haversine" formula).
// Earth is treated as a ball with radius 6371 km.
function distanceKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const toRad = (deg) => (deg * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// The main function. Takes all places + what the user chose, returns the list to show.
// state = { query, category ("all" or an id), features: [...keys], sort, userPos: {lat,lng} | null, lang }
function findPlaces(places, categories, state) {
  const categoriesById = {};
  categories.forEach((c) => (categoriesById[c.id] = c));

  // Step 1: FILTER (keep only places that pass all three checks)
  let result = places.filter(
    (p) =>
      (state.category === "all" || p.category === state.category) &&
      matchesText(p, state.query, categoriesById) &&
      matchesFeatures(p, state.features)
  );

  // Step 2: add extra info we need for showing and sorting
  result = result.map((p) => ({
    ...p,
    score: accessScore(p),
    distance: state.userPos
      ? distanceKm(state.userPos.lat, state.userPos.lng, p.lat, p.lng)
      : null,
  }));

  // Step 3: SORT
  const nameKey = state.lang === "kn" ? "name_kn" : "name_en";
  const byName = (a, b) => a[nameKey].localeCompare(b[nameKey], state.lang === "kn" ? "kn" : "en");
  if (state.sort === "nearest" && state.userPos) {
    result.sort((a, b) => a.distance - b.distance);
  } else if (state.sort === "accessible") {
    result.sort((a, b) => b.score - a.score || byName(a, b)); // most features first, then A-Z
  } else {
    result.sort(byName);
  }
  return result;
}

// Lets the test script (Node.js) use these functions too. Browsers ignore this.
if (typeof module !== "undefined") {
  module.exports = { FEATURES, normalise, matchesText, matchesFeatures, accessScore, distanceKm, findPlaces };
}

// Tries Supabase first. If it is not set up or fails, uses data.js.
async function loadData() {
  if (SUPABASE_URL && SUPABASE_ANON_KEY) {
    try {
      const headers = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };
      // Supabase gives every table a ready-made web address (REST API).
      const [catRes, placeRes] = await Promise.all([
        fetch(SUPABASE_URL + "/rest/v1/categories?select=*", { headers }),
        fetch(SUPABASE_URL + "/rest/v1/places?select=*", { headers }),
      ]);
      if (!catRes.ok || !placeRes.ok) throw new Error("Supabase replied " + catRes.status + "/" + placeRes.status);
      const categories = await catRes.json();
      const places = await placeRes.json();
      if (!places.length) throw new Error("Supabase has no places yet");
      DATA = { categories, places };
      dataSource = "supabase";
      return;
    } catch (err) {
      console.warn("Could not load from Supabase, using sample data instead.", err);
    }
  }
  DATA = SAMPLE_DATA;
  dataSource = "sample";
}

// ---------- 2. BUILD THE FILTER CONTROLS ----------
function buildCategoryChips() {
  const box = document.getElementById("category-chips");
  const options = [{ id: "all", icon: "✨" }].concat(DATA.categories);
  box.innerHTML = options
    .map((c) => {
      const label = c.id === "all" ? t("all") : pick(c, "name");
      const pressed = state.category === c.id;
      return `<button type="button" class="chip" data-cat="${esc(c.id)}" aria-pressed="${pressed}">
                <span aria-hidden="true">${esc(c.icon)}</span> ${esc(label)}</button>`;
    })
    .join("");
  box.querySelectorAll(".chip").forEach((btn) =>
    btn.addEventListener("click", () => {
      state.category = btn.dataset.cat;
      buildCategoryChips();
      render();
    })
  );
}

function buildFeatureBoxes() {
  const box = document.getElementById("feature-boxes");
  box.innerHTML = FEATURES.map((f) => {
    const checked = state.features.includes(f.key) ? "checked" : "";
    return `<label class="check"><input type="checkbox" value="${f.key}" ${checked} /> ${esc(t(f.key))}</label>`;
  }).join("");
  box.querySelectorAll("input").forEach((input) =>
    input.addEventListener("change", () => {
      state.features = [...box.querySelectorAll("input:checked")].map((i) => i.value);
      render();
    })
  );
}

// ---------- 3. DRAW THE RESULTS ----------
function featureList(p) {
  // One small tag per feature: ✓ green if present, ✗ grey if not.
  const items = [
    ["has_ramp", p.has_ramp],
    ["has_lighting", p.has_lighting],
    ["has_seating", p.has_seating],
    ["has_toilet", p.has_toilet],
  ];
  const wcText = { yes: t("wcYes"), limited: t("wcLimited"), no: t("wcNo") }[p.wheelchair] || t("wcNo");
  const wcClass = p.wheelchair === "yes" ? "yes" : p.wheelchair === "limited" ? "part" : "no";
  let html = `<li class="tag ${wcClass}"><span aria-hidden="true">${wcClass === "yes" ? "✓" : wcClass === "part" ? "◐" : "✗"}</span> ${esc(wcText)}</li>`;
  items.forEach(([key, has]) => {
    html += `<li class="tag ${has ? "yes" : "no"}"><span aria-hidden="true">${has ? "✓" : "✗"}</span>
             ${esc(t(key))}<span class="sr-only">: ${has ? t("yes") : t("no")}</span></li>`;
  });
  if (p.has_toilet) {
    html += `<li class="tag ${p.accessible_toilet ? "yes" : "part"}"><span aria-hidden="true">${p.accessible_toilet ? "♿" : "!"}</span>
             ${esc(p.accessible_toilet ? t("accToilet") : t("noAccToilet"))}</li>`;
  }
  return html;
}

function render() {
  const list = findPlaces(DATA.places, DATA.categories, state);
  const catById = {};
  DATA.categories.forEach((c) => (catById[c.id] = c));

  // Count line
  document.getElementById("count").textContent =
    list.length === 1 ? t("countOne") : t("countMany", { n: list.length });

  // Cards
  const ul = document.getElementById("results");
  if (!list.length) {
    ul.innerHTML = `<li class="empty">${esc(t("none"))}</li>`;
  } else {
    ul.innerHTML = list
      .map((p) => {
        const c = catById[p.category] || {};
        const dist = p.distance != null ? `<span class="dist">${esc(t("km", { n: p.distance.toFixed(1) }))}</span>` : "";
        const osmDir = `https://www.openstreetmap.org/directions?to=${p.lat}%2C${p.lng}`;
        return `
        <li class="card" id="card-${esc(p.id)}" style="--cat:${esc(c.color)}">
          <div class="card-top">
            <span class="cat-icon" aria-hidden="true">${esc(c.icon)}</span>
            <div class="card-title">
              <h2>${esc(pick(p, "name"))}</h2>
              <p class="small">${esc(pick(c, "name"))} · ${esc(pick(p, "area"))} ${dist}</p>
            </div>
            <span class="score" title="${esc(t("score", { n: p.score }))}">${esc(t("score", { n: p.score }))}</span>
          </div>
          <ul class="tags">${featureList(p)}</ul>
          <p class="small"><strong>${esc(t("hours"))}:</strong> ${esc(pick(p, "hours"))}
             · <span class="src ${p.source}">${esc(p.source === "osm" ? t("srcOsm") : t("srcSample"))}</span></p>
          <div class="card-actions">
            <button type="button" class="btn btn-small" data-show="${esc(p.id)}">${esc(t("showMap"))}</button>
            <a class="btn btn-small btn-ghost" href="${osmDir}" target="_blank" rel="noopener">${esc(t("directions"))} ↗</a>
          </div>
        </li>`;
      })
      .join("");
    ul.querySelectorAll("[data-show]").forEach((btn) =>
      btn.addEventListener("click", () => focusPlace(btn.dataset.show))
    );
  }
  drawMarkers(list, catById);
}

// ---------- 4. THE MAP ----------
function initMap() {
  if (typeof L === "undefined") {
    // No internet for the map library: the list still works.
    document.getElementById("map").innerHTML = '<p class="map-off">Map unavailable (offline).</p>';
    return;
  }
  map = L.map("map").setView(MANDYA_CENTER, 14);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
}

function drawMarkers(list, catById) {
  if (!map) return;
  Object.values(markers).forEach((m) => m.remove());
  Object.keys(markers).forEach((k) => delete markers[k]);

  list.forEach((p) => {
    const c = catById[p.category] || {};
    const icon = L.divIcon({
      className: "pin",
      html: `<span style="background:${esc(c.color)}">${esc(c.icon)}</span>`,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
    });
    const m = L.marker([p.lat, p.lng], { icon, title: pick(p, "name"), alt: pick(p, "name") })
      .addTo(map)
      .bindPopup(`<strong>${esc(pick(p, "name"))}</strong><br>${esc(pick(c, "name"))}<br>${esc(t("score", { n: p.score }))}`);
    m.on("click", () => highlightCard(p.id));
    markers[p.id] = m;
  });

  if (state.userPos) {
    markers.__me = L.circleMarker([state.userPos.lat, state.userPos.lng], {
      radius: 9, color: "#fff", weight: 3, fillColor: "#1c7ed6", fillOpacity: 1,
    }).addTo(map);
  }

  // Zoom the map so every shown pin fits
  const pts = list.map((p) => [p.lat, p.lng]);
  if (pts.length === 1) map.setView(pts[0], 16);
  else if (pts.length > 1) map.fitBounds(pts, { padding: [30, 30], maxZoom: 16 });
}

function focusPlace(id) {
  const m = markers[id];
  if (!m) return;
  map.setView(m.getLatLng(), 17);
  m.openPopup();
  highlightCard(id);
  if (window.innerWidth < 900) document.getElementById("map").scrollIntoView({ behavior: "smooth" });
}

function highlightCard(id) {
  document.querySelectorAll(".card.active").forEach((c) => c.classList.remove("active"));
  const card = document.getElementById("card-" + id);
  if (card) {
    card.classList.add("active");
    card.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

// ---------- 5. LANGUAGE, CONTRAST, LOCATION ----------
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
  document.getElementById("search").placeholder = t("searchPlaceholder");
  const langBtn = document.getElementById("lang-btn");
  langBtn.textContent = t("langBtn");
  langBtn.lang = state.lang === "en" ? "kn" : "en";
  document.getElementById("contrast-btn").textContent = state.highContrast ? t("contrastOn") : t("contrastOff");
  document.getElementById("data-badge").textContent = dataSource === "supabase" ? t("dataSupabase") : t("dataSample");
  buildCategoryChips();
  buildFeatureBoxes();
  render();
}

function useMyLocation() {
  const status = document.getElementById("loc-status");
  if (!navigator.geolocation) {
    status.textContent = t("locFail");
    return;
  }
  status.textContent = t("locating");
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.sort = "nearest";
      document.getElementById("sort").value = "nearest";
      status.textContent = t("located");
      render();
    },
    () => {
      state.userPos = null;
      state.sort = "name";
      document.getElementById("sort").value = "name";
      status.textContent = t("locFail");
      render();
    },
    { timeout: 10000 }
  );
}

// ---------- 6. START ----------
async function start() {
  // Remember high contrast between visits (if the browser allows it)
  try { state.highContrast = localStorage.getItem("hc") === "1"; } catch (e) {}
  document.body.classList.toggle("hc", state.highContrast);
  document.getElementById("contrast-btn").setAttribute("aria-pressed", state.highContrast);

  initMap();
  await loadData();

  document.getElementById("search").addEventListener("input", (e) => {
    state.query = e.target.value;
    render();
  });
  document.getElementById("sort").addEventListener("change", (e) => {
    state.sort = e.target.value;
    if (state.sort === "nearest" && !state.userPos) useMyLocation();
    else render();
  });
  document.getElementById("near-btn").addEventListener("click", useMyLocation);
  document.getElementById("clear-btn").addEventListener("click", () => {
    state.query = "";
    state.category = "all";
    state.features = [];
    document.getElementById("search").value = "";
    buildCategoryChips();
    buildFeatureBoxes();
    render();
  });
  document.getElementById("lang-btn").addEventListener("click", () => {
    state.lang = state.lang === "en" ? "kn" : "en";
    applyLanguage();
  });
  document.getElementById("contrast-btn").addEventListener("click", (e) => {
    state.highContrast = !state.highContrast;
    document.body.classList.toggle("hc", state.highContrast);
    e.currentTarget.setAttribute("aria-pressed", state.highContrast);
    try { localStorage.setItem("hc", state.highContrast ? "1" : "0"); } catch (err) {}
    applyLanguage();
  });

  applyLanguage(); // draws everything for the first time
}

start();

</script>
